<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b110d" />
    <meta name="color-scheme" content="dark" />
    <title>Lost in the jungle | Gábor Ulenius</title>
    <link rel="icon" type="image/png" href="/gaborulenius/favicon-32.png" />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("/gaborulenius/fonts/inter-latin-var.woff2") format("woff2");
      }

      html {
        background: #0b110d;
        color: #f6f1e4;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(
            120% 70% at 52% -10%,
            rgba(222, 226, 150, 0.14),
            rgba(222, 226, 150, 0) 60%
          ),
          radial-gradient(ellipse at 50% 46%, #21401f 0%, #142b19 42%, #0a160d 100%);
      }

      main {
        max-width: 34rem;
        text-align: center;
      }

      .code {
        margin: 0 0 12px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.32em;
        color: #d9c89a;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.2rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.08;
      }

      p {
        margin: 16px 0 0;
        font-size: 1.05rem;
        line-height: 1.6;
        color: rgba(246, 241, 228, 0.8);
      }

      a {
        display: inline-block;
        margin-top: 32px;
        padding: 12px 24px;
        border: 1px solid rgba(217, 200, 154, 0.42);
        border-radius: 999px;
        background: rgba(10, 16, 12, 0.5);
        color: #e9dcb3;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.2s ease;
      }

      a:hover {
        background: rgba(217, 200, 154, 0.16);
      }

      a:focus-visible {
        outline: 2px solid #e9dcb3;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This path is lost in the jungle.</h1>
      <p lang="en">The page you were looking for is not here.</p>
      <p lang="fi">Etsimääsi sivua ei löytynyt.</p>
      <a href="/gaborulenius/">Back to the portfolio · Takaisin portfolioon</a>
    </main>
  </body>
</html>
