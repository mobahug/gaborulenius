    <script>
      // Resolve the locale and the way the page runs before any paint, so
      // the cover greets in the right language and nothing changes after.
      (function () {
        var root = document.documentElement;
        var params = null;
        try {
          params = new URLSearchParams(window.location.search);
        } catch (e) {}
        var param = function (name) {
          return params ? params.get(name) : null;
        };

        // Language: ?lang=en|fi (a link, a search engine) becomes the
        // stored choice; otherwise the stored choice, else English.
        var asked = param("lang");
        if (asked !== "en" && asked !== "fi") asked = null;
        var locale = asked;
        try {
          if (asked) localStorage.setItem("locale", JSON.stringify(asked));
          else {
            var storedLocale = localStorage.getItem("locale");
            locale = storedLocale ? storedLocale.replace(/^"|"$/g, "") : null;
          }
        } catch (e) {}
        if (locale !== "en" && locale !== "fi") locale = "en";
        root.dataset.locale = locale;

        // Quick read: the essentials on one calm page instead of the film
        // journey. ?read (a link for recruiters) or the visitor's own
        // choice turns it on; ?read=0 off.
        var read = param("read");
        var quick = false;
        try {
          if (read !== null) {
            quick = read !== "0" && read !== "false";
            localStorage.setItem("quickRead", quick ? "1" : "0");
          } else quick = localStorage.getItem("quickRead") === "1";
        } catch (e) {
          quick = read !== null && read !== "0" && read !== "false";
        }
        root.dataset.quickRead = quick ? "true" : "false";

        // A system asking for reduced motion runs the journey in its
        // reduced mode (data-motion="reduced"): stills, nothing held.
        var motion = window.matchMedia
          ? window.matchMedia("(prefers-reduced-motion: reduce)")
          : null;
        var applyMotion = function () {
          if (motion && motion.matches) {
            root.dataset.motion = "reduced";
          } else {
            delete root.dataset.motion;
          }
        };
        applyMotion();
        if (motion && motion.addEventListener) {
          motion.addEventListener("change", applyMotion);
        }
      })();
    </script>

      /* The cover is part of the document flow; keep it still when the
         app's CSS baseline arrives. */
      body {

      }

      /* Words for screen readers (and search engines) only. */
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      :root[data-motion="reduced"] {
        scroll-behavior: auto;
      }

      /* The loader covers the first paint while the film arrives. Its ring
         shows progress; the morpho then flies onto the greeting. */
      #jungle-loader {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        overflow: hidden;
        /* Should its script never run, it still goes. */
        animation: jl-out 0.9s ease 9s forwards;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      #jungle-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            120% 70% at 52% -10%,
            rgba(222, 226, 150, 0.2),
            rgba(222, 226, 150, 0) 60%
          ),
          radial-gradient(
            ellipse at 50% 46%,
            #21401f 0%,
            #142b19 42%,
            #0a160d 100%
          );
        transition: opacity 0.7s ease;
        pointer-events: none;
      }

      /* The film and cover replace the loader's background while the same
         butterfly flies to the greeting. */
      #jungle-loader.is-landing {
        animation: none;
        pointer-events: none;
      }

      #jungle-loader.is-landing::before {
        opacity: 0;
      }

      /* An early scroll, tap or timeout still dismisses the loader. */
      #jungle-loader.is-leaving {
        animation: jl-leave 0.9s ease 0.35s forwards;
        pointer-events: none;
      }

      .jl-scene {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 26px;
      }

      .jl-stage {
        position: relative;
        width: 156px;
        height: 156px;
        display: grid;
        place-items: center;
      }

      .jl-ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        rotate: -90deg;
        transition: opacity 0.2s ease;
      }

      .jl-ring circle {
        fill: none;
      }

      .jl-track {
        stroke: rgba(233, 220, 179, 0.16);
        stroke-width: 1;
      }

      .jl-fill {
        stroke: #e9dcb3;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: calc(100 - var(--p, 0) * 100);
        filter: drop-shadow(0 0 3px rgba(233, 220, 179, 0.6));
        transition: stroke-dashoffset 0.4s ease;
      }

      .jl-flight {
        width: 92px;
        height: 78px;
        display: grid;
        place-items: center;
        transform-origin: center;
      }

      .jl-morpho {
        width: 92px;
        height: 78px;
        overflow: visible;
        filter: drop-shadow(0 0 14px rgba(70, 160, 255, 0.45));
        transform-origin: center;
      }

      /* A wing beats around the body (x = 0), never closing to an edge. */
      .jl-wing {
        transform-box: view-box;
        transform-origin: 0 0;
      }

      .jl-name {
        margin: 0;
        font:
          600 0.72rem/1 "Inter",
          system-ui,
          sans-serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(233, 220, 179, 0.78);
        transition: opacity 0.2s ease;
      }

      /* Motes of light drifting down through the canopy. */
      .jl-mote {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(240, 232, 190, 0.8);
        box-shadow: 0 0 8px rgba(240, 232, 190, 0.7);
        opacity: 0;
        animation: jl-mote 7s linear infinite;
      }

      .jl-mote:nth-child(1) {
        left: 22%;
        top: 18%;
        animation-delay: -1s;
      }
      .jl-mote:nth-child(2) {
        left: 64%;
        top: 12%;
        animation-delay: -3.5s;
      }
      .jl-mote:nth-child(3) {
        left: 78%;
        top: 38%;
        animation-delay: -5s;
      }
      .jl-mote:nth-child(4) {
        left: 36%;
        top: 30%;
        animation-delay: -2.2s;
      }
      .jl-mote:nth-child(5) {
        left: 12%;
        top: 52%;
        animation-delay: -4.4s;
      }
      .jl-mote:nth-child(6) {
        left: 56%;
        top: 58%;
        animation-delay: -6s;
      }

      #jungle-loader.is-landing .jl-ring,
      #jungle-loader.is-landing .jl-name,
      #jungle-loader.is-landing .jl-mote {
        opacity: 0;
      }

      #jungle-loader.is-landing .jl-mote {
        animation: none;
      }

      /* Before the film is ready, let a scrolling visitor through at once. */
      #jungle-loader.is-leaving .jl-flight {
        animation: jl-away 1.1s cubic-bezier(0.45, 0, 0.55, 1) forwards;
      }

      #jungle-loader.is-leaving .jl-ring,
      #jungle-loader.is-leaving .jl-name {
        opacity: 0;
      }

      @keyframes jl-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @keyframes jl-leave {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @keyframes jl-away {
        to {
          translate: 18vw -62vh;
          rotate: 16deg;
          scale: 0.7;
        }
      }

      @keyframes jl-mote {
        0% {
          opacity: 0;
          transform: translate3d(0, -20px, 0);
        }
        20%,
        70% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
          transform: translate3d(14px, 120px, 0);
        }
      }

      :root[data-motion="reduced"] #jungle-loader,
      :root[data-quick-read="true"] #jungle-loader {
        display: none;
      }

      /* Quick read stands on one calm picture: the jungle path, out of
         focus and dimmed, still while the page scrolls — there from the
         first paint, before the page's script has arrived. */
      :root[data-quick-read="true"] body::before {

        background: #0b110d url("film/jungle_chase-still.webp") center / cover
          no-repeat;
        filter: blur(14px) brightness(0.5) saturate(1.05);
      }

      // When the first film plays, the loader's butterfly lands by Gábor's r.
      // It leaves on the first scroll. An early tap, scroll, key, or timeout
      // still dismisses the loader so it never traps the visitor.
      (function () {
        var loader = document.getElementById("jungle-loader");
        if (!loader) return;
        var root = document.documentElement;
        var stage = loader.querySelector(".jl-stage");
        var flight = loader.querySelector(".jl-flight");
        var wings = loader.querySelectorAll(".jl-wing");
        // Reduced motion and quick read show no film to wait for.
        if (
          root.dataset.motion === "reduced" ||
          root.dataset.quickRead === "true"
        ) {
          loader.remove();
          return;
        }
        var phase = "loading";
        var film = null;
        var pendingDeparture = false;
        var removalTimer = 0;
        var positionFrame = 0;
        var animationFrame = 0;
        var lastFrame = 0;
        var stageCenterX = 0;
        var stageCenterY = 0;
        var initialDistance = 1;
        var returning = false;
        var filmObserver;
        var localeObserver;
        var skipEvents = ["wheel", "touchmove", "keydown"];
        var pointer = { x: -1e4, y: -1e4 };
        var flyer = {
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          tx: 0,
          ty: 0,
          heading: 0,
          flap: 0,
          alpha: 1,
          since: 0,
          seed: 3,
        };
        var smoothstep = function (start, end, value) {
          var t = Math.min(1, Math.max(0, (value - start) / (end - start)));
          return t * t * (3 - 2 * t);
        };
        var pointerNear = function () {
          return (
            Math.hypot(
              pointer.x - (stageCenterX + flyer.x),
              pointer.y - (stageCenterY + flyer.y),
            ) <
            46 * 1.2
          );
        };
        var startle = function (now) {
          if (phase !== "perched") return;
          phase = "startled";
          flyer.since = now;
          loader.classList.remove("is-perched");
          loader.classList.add("is-startled");
        };
        var onPointerMove = function (event) {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
        };
        var onPointerDown = function (event) {
          onPointerMove(event);
          if (pointerNear()) startle(performance.now());
        };
        var onPointerEnd = function (event) {
          if (event.pointerType !== "mouse") {
            pointer.x = -1e4;
            pointer.y = -1e4;
          }
        };

        var onProgress = function (event) {
          var detail = event.detail || {};
          if (film === null) film = detail.index;
          if (detail.index !== film) return;
          loader.style.setProperty("--p", String(detail.progress));
        };
        var onScroll = function () {
          if (window.scrollY <= 8) return;
          if (phase === "landing" && !returning) pendingDeparture = true;
          else if (
            phase === "perched" ||
            phase === "startled" ||
            (phase === "landing" && returning)
          )
            depart();
        };
        var positionPerch = function () {
          var name = document.getElementById("cover-name");
          if (!name || !stage) return false;
          var finalLetter = name.lastChild;
          if (
            !finalLetter ||
            finalLetter.nodeType !== Node.TEXT_NODE ||
            !finalLetter.textContent
          )
            return false;
          var letter = document.createRange();
          letter.setStart(finalLetter, finalLetter.textContent.length - 1);
          letter.setEnd(finalLetter, finalLetter.textContent.length);
          var target = letter.getBoundingClientRect();
          var origin = stage.getBoundingClientRect();
          if (!target.width || !target.height) return false;
          stageCenterX = origin.left + origin.width / 2;
          stageCenterY = origin.top + origin.height / 2;
          flyer.tx = target.right - 1 - stageCenterX;
          flyer.ty = target.top + 1 - stageCenterY;
          return true;
        };
        var schedulePosition = function () {
          window.cancelAnimationFrame(positionFrame);
          positionFrame = window.requestAnimationFrame(positionPerch);
        };
        var stopWaiting = function () {
          filmObserver.disconnect();
          window.removeEventListener("filmprogress", onProgress);
          loader.removeEventListener("click", skip);
          skipEvents.forEach(function (type) {
            window.removeEventListener(type, skip);
          });
          window.clearTimeout(removalTimer);
        };
        var removeLoader = function () {
          phase = "gone";
          window.clearTimeout(removalTimer);
          window.cancelAnimationFrame(positionFrame);
          window.cancelAnimationFrame(animationFrame);
          window.removeEventListener("scroll", onScroll);
          window.removeEventListener("resize", schedulePosition);
          window.removeEventListener("pointermove", onPointerMove);
          window.removeEventListener("pointerdown", onPointerDown);
          window.removeEventListener("pointerup", onPointerEnd);
          window.removeEventListener("pointercancel", onPointerEnd);
          if (localeObserver) localeObserver.disconnect();
          loader.remove();
        };
        var depart = function () {
          if (phase === "landing" && !returning) {
            pendingDeparture = true;
            return;
          }
          if (
            phase !== "perched" &&
            phase !== "startled" &&
            phase !== "landing"
          )
            return;
          phase = "departing";
          loader.classList.remove("is-perched", "is-startled");
          loader.classList.add("is-flying-away");
          window.removeEventListener("scroll", onScroll);
          window.removeEventListener("resize", schedulePosition);
          if (localeObserver) localeObserver.disconnect();
          removalTimer = window.setTimeout(removeLoader, 2200);
        };
        var skip = function () {
          if (phase !== "loading") return;
          phase = "leaving";
          stopWaiting();
          loader.classList.add("is-leaving");
          removalTimer = window.setTimeout(removeLoader, 1300);
        };
        var land = function () {
          if (phase !== "loading") return;
          if (window.scrollY > 8 || !positionPerch()) {
            skip();
            return;
          }
          phase = "landing";
          returning = false;
          initialDistance = Math.max(
            1,
            Math.hypot(flyer.tx - flyer.x, flyer.ty - flyer.y),
          );
          flyer.vx = Math.sign(flyer.tx - flyer.x) * 220;
          flyer.vy = 40;
          stopWaiting();
          loader.classList.add("is-landing");
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", schedulePosition);
          localeObserver = new MutationObserver(schedulePosition);
          localeObserver.observe(root, {
            attributes: true,
            attributeFilter: ["data-locale"],
          });
        };
        // Match Flock.update and Flock.render in butterflies.ts: spring
        // steering, distance-based flutter, heading and wing cadence.
        var animate = function (now) {
          var dt = lastFrame
            ? Math.min(0.05, (now - lastFrame) / 1000)
            : 1 / 60;
          lastFrame = now;
          var near = pointerNear();
          if (phase === "perched" && near) startle(now);
          if (phase === "startled" && now - flyer.since > 1400 && !near) {
            phase = "landing";
            returning = true;
            loader.classList.remove("is-startled");
          }
          if (
            phase === "landing" ||
            phase === "startled" ||
            phase === "departing"
          ) {
            var leaving = phase === "departing";
            var startled = phase === "startled";
            var targetX = leaving
              ? flyer.x + 300
              : startled
                ? flyer.tx + Math.sin(flyer.seed) * 60
                : flyer.tx;
            var targetY = leaving
              ? -stageCenterY - 160
              : startled
                ? flyer.ty - 90
                : flyer.ty;
            var dx = targetX - flyer.x;
            var dy = targetY - flyer.y;
            var distance = Math.hypot(dx, dy);
            var t = now / 1000 + flyer.seed;
            var flutter =
              phase === "landing" ? smoothstep(8, 90, distance) : 1.4;
            var ax =
              dx * 9 -
              flyer.vx * 4 +
              flutter * (Math.sin(t * 2.7) * 120 + Math.sin(t * 6.1) * 60);
            var ay =
              dy * 9 -
              flyer.vy * 4 +
              flutter * (Math.sin(t * 3.3) * 140 + Math.cos(t * 7.3) * 50);
            flyer.vx += ax * dt;
            flyer.vy += ay * dt;
            var speed = Math.hypot(flyer.vx, flyer.vy);
            if (speed > 600) {
              flyer.vx *= 600 / speed;
              flyer.vy *= 600 / speed;
            }
            flyer.x += flyer.vx * dt;
            flyer.y += flyer.vy * dt;
            if (phase === "landing" && distance < 6 && speed < 80) {
              phase = "perched";
              returning = false;
              flyer.x = flyer.tx;
              flyer.y = flyer.ty;
              flyer.vx = 0;
              flyer.vy = 0;
              loader.classList.add("is-perched");
              if (pendingDeparture || window.scrollY > 8) depart();
            }
          } else if (phase === "perched") {
            flyer.x = flyer.tx;
            flyer.y = flyer.ty;
          }
          var perched = phase === "loading" || phase === "perched";
          var aim =
            perched || phase === "leaving"
              ? -0.1
              : Math.atan2(flyer.vx, -flyer.vy) * 0.5;
          flyer.heading += (aim - flyer.heading) * (1 - Math.exp(-dt / 0.2));
          flyer.flap += dt * (perched ? 1.1 + Math.sin(flyer.seed) * 0.3 : 22);
          var lift = perched
            ? 0.3 +
              0.3 * Math.sin(flyer.flap) +
              (Math.sin(flyer.flap * 0.37) > 0.93 ? 0.3 : 0)
            : 0.35 + 0.65 * Math.sin(flyer.flap);
          var open = Math.max(0.36, Math.cos((lift * 70 * Math.PI) / 180));
          wings.forEach(function (wing) {
            wing.style.transform = "scaleX(" + open + ")";
          });
          if (phase === "departing") {
            flyer.alpha += (0 - flyer.alpha) * (1 - Math.exp(-dt / 0.45));
            if (flyer.alpha < 0.02 || stageCenterY + flyer.y < -120) {
              removeLoader();
              return;
            }
          }
          var scale =
            phase === "landing" && !returning
              ? 0.48 +
                0.52 *
                  Math.min(
                    1,
                    Math.hypot(flyer.tx - flyer.x, flyer.ty - flyer.y) /
                      initialDistance,
                  )
              : phase === "perched" ||
                  phase === "startled" ||
                  phase === "departing" ||
                  returning
                ? 0.48
                : 1;
          flight.style.transform =
            "translate3d(" +
            flyer.x +
            "px, " +
            flyer.y +
            "px, 0) scale(" +
            scale +
            ") rotate(" +
            flyer.heading +
            "rad)";
          flight.style.opacity = String(flyer.alpha);
          animationFrame = window.requestAnimationFrame(animate);
        };
        window.addEventListener("filmprogress", onProgress);
        filmObserver = new MutationObserver(function () {
          if (root.dataset.filmReady === "true") land();
        });
        filmObserver.observe(root, {
          attributes: true,
          attributeFilter: ["data-film-ready"],
        });
        loader.addEventListener("click", skip);
        window.addEventListener("pointermove", onPointerMove, {
          passive: true,
        });
        window.addEventListener("pointerdown", onPointerDown, {
          passive: true,
        });
        window.addEventListener("pointerup", onPointerEnd, { passive: true });
        window.addEventListener("pointercancel", onPointerEnd, {
          passive: true,
        });
        skipEvents.forEach(function (type) {
          window.addEventListener(type, skip, { passive: true });
        });
        removalTimer = window.setTimeout(skip, 5500);
        if (root.dataset.filmReady === "true") land();
        animationFrame = window.requestAnimationFrame(animate);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
